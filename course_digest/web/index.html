<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>course-digest</title>

<!-- 全部本地 vendor，无 CDN（ADR-004：断网可用）
     路径用**根绝对路径**：页面在 /doc/<id> 下时，./vendor 会被解析成 /doc/vendor/...
     → 撞上 SPA 路由，拿回一份 HTML，模块脚本直接被浏览器拒执行 -->
<link rel="stylesheet" href="/vendor/pdfjs/pdf_viewer.css">
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/vendor/highlight.js/github.min.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header id="topbar">
  <div class="brand">
    <span id="doc-title">加载中…</span>
    <span id="doc-sub" class="sub"></span>
  </div>

  <div class="actions">
    <div class="segmented" id="version-switch" role="group" aria-label="PDF 版本">
      <button type="button" data-version="simplified" class="active">简化版</button>
      <button type="button" data-version="full">完整版</button>
    </div>

    <!-- 字号控件：MD 与 PDF 是**两套独立语义**（MD 改排版 / PDF 改缩放，ADR-018），
         所以两组控件、两套 localStorage 键，互不影响 -->
    <div class="font-controls" id="font-controls">
      <span class="font-group" data-target="pdf">
        <span class="font-label">PDF</span>
        <button type="button" class="font-dec" aria-label="缩小 PDF">−</button>
        <button type="button" class="font-now" aria-label="重置 PDF 字号（点击回到 100%）">100%</button>
        <button type="button" class="font-inc" aria-label="放大 PDF">+</button>
      </span>
      <span class="font-group" data-target="md">
        <span class="font-label">MD</span>
        <button type="button" class="font-dec" aria-label="缩小 MD">−</button>
        <button type="button" class="font-now" aria-label="重置 MD 字号（点击回到 16）">16</button>
        <button type="button" class="font-inc" aria-label="放大 MD">+</button>
      </span>
    </div>

    <button type="button" id="btn-download">下载 MD</button>
    <button type="button" id="btn-pdf">下载 PDF</button>
  </div>
</header>

<main id="layout">

  <!-- 左：PDF。自有 canvas 列表 + 虚拟化（ADR-005），不用内置 viewer.html -->
  <section id="pdf-pane" aria-label="课件原文">
    <div id="pdf-scroll">
      <div id="pdf-pages"></div>
    </div>
    <div id="pdf-status" class="status" hidden></div>
  </section>

  <!-- 分栏拖拽手柄（ADR-017：不设限位，纯流式拖；≤900px 时隐藏，走 v0.1.0 的上下堆叠） -->
  <div class="split-handle" id="split-handle" role="separator"
       aria-label="拖动调整左右分栏"></div>

  <!-- 右：Markdown 总结 -->
  <aside id="md-pane" aria-label="总结">
    <div id="md-scroll">
      <article id="md"></article>
    </div>
  </aside>

</main>

<!-- 经典脚本（UMD）：先于 module 执行，全局在 app.js 运行前就绪 -->
<script src="/vendor/marked/marked.umd.js"></script>
<script src="/vendor/katex/katex.min.js"></script>
<script src="/vendor/katex/auto-render.min.js"></script>
<script src="/vendor/highlight.js/highlight.min.js"></script>

<script type="module" src="/app.js"></script>
</body>
</html>
